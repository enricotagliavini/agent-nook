[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-nook"
version = "0.1.0"
description = "A lightweight bwrap sandbox for AI agents"
readme = "README.md"
license = {text = "GPL-3.0"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Sandboxing",
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bubblewrap = ["bubblewrap-bin>=0.11.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0", "mypy>=1.0.0"]

[project.scripts]
agent-nook = "agent_nook.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nook"]

[tool.hatch.build.targets.sdist]
# Ship src/ with all config files included in agent_nook/ package
only-include = ["src/"]
