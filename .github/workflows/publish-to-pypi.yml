name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    tags:
      - 'v*'
      - 'b*'

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build
        run: pip install build

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 3

  validate-tag:
    name: Validate tag format
    runs-on: ubuntu-latest
    outputs:
      is-valid-version: ${{ steps.validate.outputs.is-valid-version }}
      is-prerelease: ${{ steps.validate.outputs.is-prerelease }}
      version-matches: ${{ steps.validate.outputs.version-matches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate tag
        id: validate
        run: |
          TAG="${{ github.ref_name }}"
          VERSION_FILE="src/agent_nook/__init__.py"

          # Single source of truth for the version; hatch reads this dynamically.
          SRC_VERSION="$(grep -E "^[[:space:]]*__version__[[:space:]]*=" "$VERSION_FILE" \
            | head -n1 \
            | sed -E 's/.*= *"([^"]+)".*/\1/')"

          # Strip a single leading v/b prefix from the tag to get the numeric version.
          TAG_VERSION="$(printf '%s' "$TAG" | sed -E 's/^[vb]//')"

          echo "tag='${TAG}' tag-version='${TAG_VERSION}' package-version='${SRC_VERSION}'"

          # The tag version must match the version declared in the package.
          if [[ "$TAG_VERSION" != "$SRC_VERSION" ]]; then
            echo "::error::Tag version '${TAG_VERSION}' does not match the package version '${SRC_VERSION}' in src/agent_nook/__init__.py"
            exit 1
          fi
          echo "version-matches=true" >> $GITHUB_OUTPUT

          # Tag format: vMAJOR.MINOR.PATCH is a stable release, bMAJOR.MINOR.PATCH is a beta.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-valid-version=true" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^b[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-valid-version=true" >> $GITHUB_OUTPUT
            echo "is-prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is-valid-version=false" >> $GITHUB_OUTPUT
            echo "is-prerelease=false" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish Python 🐍 distribution 📦 to PyPI
    runs-on: ubuntu-latest
    needs: [build, validate-tag]
    environment:
      name: pypi
      url: https://pypi.org/p/agent-nook
    permissions:
      id-token: write
    if: ${{ needs.validate-tag.outputs.is-valid-version == 'true' && needs.validate-tag.outputs.is-prerelease == 'false' && needs.validate-tag.outputs.version-matches == 'true' }}
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-test:
    name: Publish Python 🐍 distribution 📦 to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, validate-tag]
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agent-nook
    permissions:
      id-token: write
    if: ${{ needs.validate-tag.outputs.is-valid-version == 'true' && needs.validate-tag.outputs.version-matches == 'true' }}
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution 📦 to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  release:
    name: Create GitHub Release 🏷️
    runs-on: ubuntu-latest
    needs: [build, validate-tag]
    permissions:
      contents: write
    if: ${{ needs.validate-tag.outputs.is-valid-version == 'true' && needs.validate-tag.outputs.version-matches == 'true' }}
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: ${{ needs.validate-tag.outputs.is-prerelease == 'false' && '🎉 A new stable release is available!' || '🧪 A new beta/pre-release is available!' }}
          prerelease: ${{ needs.validate-tag.outputs.is-prerelease == 'true' }}
